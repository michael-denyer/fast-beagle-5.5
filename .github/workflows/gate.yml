name: gate

# tests/gate-steps.sh: every check of the pre-merge gate (tests/check-local.sh
# runs the same list). Lint runs in lint.yml. The gate job is the single
# required check: it passes only when every check job passed, or when the plan
# ran no checks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Picks the tier. Pushes to main run the C tier, which compares the C binary
  # against recorded results. A pull request runs the tier tests/gate-tier.sh
  # picks from its changed files, and no checks when that tier is none (every
  # changed file is documentation). The nightly run uses the full tier with random
  # fuzz examples, and is skipped when main has not moved since its last
  # success. Manual runs use the full tier.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      tier: ${{ steps.plan.outputs.tier }}
      fuzz: ${{ steps.plan.outputs.fuzz }}
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          run=true tier=c fuzz=fixed
          case $EVENT in
            pull_request)
              tier=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | tests/gate-tier.sh)
              if [ "$tier" = none ]; then run=false; fi ;;
            workflow_dispatch) tier=full fuzz=random ;;
            schedule)
              tier=full fuzz=random
              last=$(gh api "repos/$REPO/actions/workflows/gate.yml/runs?branch=main&event=schedule&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // ""')
              if [ "$last" = "$SHA" ]; then run=false; fi ;;
          esac
          # The matrix takes its groups from the check declarations. The none
          # tier skips the check job, so any valid tier keeps the matrix well formed.
          plan_tier=$tier
          [ "$plan_tier" != none ] || plan_tier=full
          groups=$(GATE_LIST_GROUPS=1 GATE_TIER="$plan_tier" tests/gate-steps.sh . \
                   | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "run=$run tier=$tier fuzz=$fuzz groups=$groups"
          { echo "run=$run"; echo "tier=$tier"; echo "fuzz=$fuzz"; echo "groups=$groups"; } >> "$GITHUB_OUTPUT"

  # One job per runner and check group of tests/gate-steps.sh; the setup
  # checks (the fixtures and the C build) run in every job. The cases check
  # tests shell logic that behaves the same on both runners but takes minutes
  # longer on macOS, so it runs on Linux only. The java-jar and java-source
  # groups run Java alone against recorded hashes that do not depend on the
  # runner, so they run on Linux only too, which keeps the macOS jobs within
  # the five that run at once. ThreadSanitizer runs on macOS only (see
  # tests/check-tsan.sh).
  check:
    name: check (${{ matrix.runner }}, ${{ matrix.group }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-latest]
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
        exclude:
          - runner: macos-latest
            group: cases
          - runner: macos-latest
            group: java-jar
          - runner: macos-latest
            group: java-source
          - runner: ubuntu-latest
            group: tsan
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.11.32
      - name: Install htslib (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ ! -e /usr/include/htslib/hts.h ] || ! command -v tabix > /dev/null; then
            sudo apt-get update && sudo apt-get install -y libhts-dev tabix
          fi
      - name: Install htslib (macOS)
        if: runner.os == 'macOS'
        run: brew list htslib > /dev/null 2>&1 || brew install htslib
      # The plink2 build tests/check-bgen.sh pins (see docs/testing.md).
      - name: Install plink2 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fSL -o plink2.zip https://s3.amazonaws.com/plink2-assets/alpha7/plink2_linux_x86_64_20260919.zip
          echo "7ded2a083cf6863e997099d1adf5e4b86ad6b5112d2934e2b020cfd77f9bdaeb  plink2.zip" | sha256sum -c -
          unzip -o plink2.zip plink2 -d "$RUNNER_TEMP/plink2"
      - name: Install plink2 (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fSL -o plink2.zip https://s3.amazonaws.com/plink2-assets/alpha7/plink2_mac_arm64_20260919.zip
          echo "04be4b865ad4b79a61b61ba2eb7468b4dbf62674dc5f7c94484fe0e5471539e4  plink2.zip" | shasum -a 256 -c -
          unzip -o plink2.zip plink2 -d "$RUNNER_TEMP/plink2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data
          key: fixtures-${{ hashFiles('tests/fetch-fixtures.sh') }}
      - name: Gate
        env:
          GATE_TIER: ${{ needs.plan.outputs.tier }}
          GATE_GROUP: ${{ matrix.group }}
          GATE_FUZZ: ${{ needs.plan.outputs.fuzz }}
        run: PLINK2="$RUNNER_TEMP/plink2/plink2" tests/gate-steps.sh .
      - name: Tail of every check log
        if: failure()
        run: tail -n 40 build/check-*.log
      # The tail alone can hide a report printed well before the log ends.
      - name: Context before every FAIL line
        if: failure()
        run: grep -B 40 -A 5 '^FAIL' build/check-*.log | head -n 2000 || true
      - name: Keep every check log
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: check-logs-${{ matrix.runner }}-${{ matrix.group }}
          path: build/check-*.log
          if-no-files-found: ignore
      - name: Keep the shrunk fuzz failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-fail-${{ matrix.runner }}-${{ matrix.group }}
          path: build/fuzz-fail
          if-no-files-found: ignore

  gate:
    needs: [plan, check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          RUN: ${{ needs.plan.outputs.run }}
          CHECK: ${{ needs.check.result }}
        run: |
          echo "plan=$PLAN run=$RUN check=$CHECK"
          if [ "$PLAN" = success ] && { [ "$CHECK" = success ] || { [ "$CHECK" = skipped ] && [ "$RUN" = false ]; }; }; then
            exit 0
          fi
          echo "::error::gate failed: plan $PLAN, run $RUN, check $CHECK"
          exit 1
