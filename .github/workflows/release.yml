name: release

# Builds the release artifacts from one source tarball and proves each binary
# byte-identical to Beagle 5.5 with tests/check-oracle.sh: the conda package
# built from release/conda/ on each platform, and a portable binary with htslib
# linked statically on each platform. It also builds a signed and notarised
# macOS installer of the macOS binary. A pushed v5.5.<n> tag then publishes the
# GitHub Release. Pull requests and manual runs do everything but publish, and
# a manual run fails unless its commit is on main and passed the gate.
# docs/release.md describes the release steps.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - release/**
      - Makefile
  workflow_dispatch:

permissions:
  contents: read

# bash with pipefail, so that a failed check piped through tee fails its step.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The tarball every other job builds from, and the conda recipe with its
  # version and sha256 filled in. A tag names the version and must be
  # v5.5.<n>; other runs use the recipe's version. A tag's commit must be on
  # main with a passing gate check run. Manual runs take the same check, so
  # that it can be tried without pushing a tag.
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            if ! [[ $REF_NAME =~ ^v5\.5\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::tag $REF_NAME is not v5.5.<n>: this repository releases the Beagle 5.5 edition"
              exit 1
            fi
            version=${REF_NAME#v}
          else
            version=$(sed -n 's/^  version: "\(.*\)"$/\1/p' release/conda/recipe.yaml)
          fi
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
      - name: The commit is on main and passed the gate
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          failed=0
          status=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::commit $SHA is not on main (compare status $status): only a commit on main is released"
            failed=1
          fi
          passed=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=gate&per_page=100" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" -eq 0 ]; then
            echo "::error::commit $SHA has no successful gate check run: only a commit that passed the gate is released"
            failed=1
          fi
          exit "$failed"
      # git archive stores the commit time as every file's time, and git's
      # gzip writes no timestamp, so the tarball depends only on the commit.
      - name: Source tarball and recipe
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist recipe
          git archive --format=tar.gz --prefix="fast-beagle-$VERSION/" -o "dist/fast-beagle-$VERSION.tar.gz" HEAD
          sha=$(sha256sum "dist/fast-beagle-$VERSION.tar.gz" | cut -d' ' -f1)
          echo "$sha  fast-beagle-$VERSION.tar.gz" | tee -a "$GITHUB_STEP_SUMMARY"
          cp release/conda/build.sh release/conda/small.vcf recipe/
          sed -e "s/^  version: \".*\"$/  version: \"$VERSION\"/" -e "s/^  sha256: .*/  sha256: $sha/" \
            release/conda/recipe.yaml > recipe/recipe.yaml
          grep -x "  version: \"$VERSION\"" recipe/recipe.yaml
          grep -x "  sha256: $sha" recipe/recipe.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-source
          path: dist
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: conda-recipe
          path: recipe
          if-no-files-found: error

  # Builds the recipe from the tarball with the conda toolchain, as bioconda
  # will, installs the package and checks the installed binary against every
  # oracle hash.
  conda:
    name: conda (${{ matrix.platform }})
    needs: source
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-64
            rattler-build: rattler-build-x86_64-unknown-linux-musl
            rattler-build-sha256: 38359a75f4a880442432923d6e984d349bb4134d330edd712eb1cfb2fa80581a
            micromamba: micromamba-linux-64
            micromamba-sha256: 366cd9cd8be14df1ab8ed50352a82111082a36686b2d389fdb79a92c3fafb3e3
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            rattler-build: rattler-build-aarch64-unknown-linux-musl
            rattler-build-sha256: 8f5ae1c3faf08c50007bbfe896cee84dcf5f4b8e8cc3a5fa400695c82abed2ae
            micromamba: micromamba-linux-aarch64
            micromamba-sha256: 9f93b974adcb4d166996af969b6cd371287d1a3e52733704727884d9b74cb7a7
          - runner: macos-latest
            platform: osx-arm64
            rattler-build: rattler-build-aarch64-apple-darwin
            rattler-build-sha256: 3809453e95380d598f2c4264480396029781fc64a9b940f3e19f84485fad75bf
            micromamba: micromamba-osx-arm64
            micromamba-sha256: ec2a072f028e1a7cf20f3e2e74d5a8127cf5a5f27636375b5359811565f4e5be
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-source
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: conda-recipe
          path: recipe
      # rattler-build 0.76.1 and micromamba 2.9.0-0.
      - name: Install rattler-build and micromamba
        env:
          RATTLER_BUILD: ${{ matrix.rattler-build }}
          RATTLER_BUILD_SHA256: ${{ matrix.rattler-build-sha256 }}
          MICROMAMBA: ${{ matrix.micromamba }}
          MICROMAMBA_SHA256: ${{ matrix.micromamba-sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl -fSL -o rattler-build "https://github.com/prefix-dev/rattler-build/releases/download/v0.76.1/$RATTLER_BUILD"
          curl -fSL -o micromamba "https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/$MICROMAMBA"
          printf '%s  rattler-build\n%s  micromamba\n' "$RATTLER_BUILD_SHA256" "$MICROMAMBA_SHA256" | shasum -a 256 -c -
          chmod +x rattler-build micromamba
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The recipe fetches the tarball from a file URL in place of the release
      # URL, and still checks its sha256.
      - name: Build the recipe
        run: |
          sed "s|^  url: .*|  url: file://$PWD/dist/fast-beagle-$VERSION.tar.gz|" recipe/recipe.yaml > recipe/local.yaml
          mv recipe/local.yaml recipe/recipe.yaml
          rattler-build build --recipe recipe --output-dir conda-out -c conda-forge -c bioconda
      - name: Install the package
        run: |
          export MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba"
          micromamba create --yes --prefix "$RUNNER_TEMP/env" --strict-channel-priority --override-channels \
            --channel "file://$PWD/conda-out" --channel conda-forge --channel bioconda "fast-beagle=$VERSION"
          micromamba list --prefix "$RUNNER_TEMP/env" '^(fast-beagle|htslib)$'
          if [ "$RUNNER_OS" = Linux ]; then ldd "$RUNNER_TEMP/env/bin/fast-beagle"; else otool -L "$RUNNER_TEMP/env/bin/fast-beagle"; fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      # tests/fetch-fixtures.sh needs bgzip.
      - name: Install bgzip (Linux)
        if: runner.os == 'Linux'
        run: command -v bgzip > /dev/null || { sudo apt-get update && sudo apt-get install -y tabix; }
      - name: Install bgzip (macOS)
        if: runner.os == 'macOS'
        run: brew list htslib > /dev/null 2>&1 || brew install htslib
      - name: Oracle check of the installed binary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          tar -xzf "dist/fast-beagle-$VERSION.tar.gz"
          cd "fast-beagle-$VERSION"
          tests/check-oracle.sh "$RUNNER_TEMP/env/bin/fast-beagle" | tee "$RUNNER_TEMP/oracle.log"
          echo "conda $PLATFORM: $(grep -c '^PASS' "$RUNNER_TEMP/oracle.log") oracle runs passed" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: conda-${{ matrix.platform }}
          path: conda-out/${{ matrix.platform }}/*.conda
          if-no-files-found: error

  # A portable binary per platform with htslib linked statically
  # (release/build-static.sh), checked against every oracle hash. The Linux
  # binaries build in manylinux_2_28 containers, so they run on glibc 2.28 or
  # later, and are checked on the runner itself.
  binaries:
    name: binary (${{ matrix.name }})
    needs: source
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: linux-x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.09.29-1@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
          - runner: ubuntu-24.04-arm
            name: linux-arm64
            image: quay.io/pypa/manylinux_2_28_aarch64:2026.09.29-1@sha256:c22ffd129ac99a8a42d1f2c2f4e88a9089288dd9ee987a7092da1c7dc48f27a9
          - runner: macos-latest
            name: macos-arm64
            image: ''
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.source.outputs.version }}
      PACKAGE: fast-beagle-${{ needs.source.outputs.version }}-${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-source
          path: dist
      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          tar -xzf "dist/fast-beagle-$VERSION.tar.gz"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/fast-beagle-$VERSION:/src" -w /src "$IMAGE" \
            release/build-static.sh "$VERSION"
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          tar -xzf "dist/fast-beagle-$VERSION.tar.gz"
          cd "fast-beagle-$VERSION"
          release/build-static.sh "$VERSION"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      # tests/fetch-fixtures.sh needs bgzip. Installed after the build, so the
      # build cannot find this htslib.
      - name: Install bgzip (Linux)
        if: runner.os == 'Linux'
        run: command -v bgzip > /dev/null || { sudo apt-get update && sudo apt-get install -y tabix; }
      - name: Install bgzip (macOS)
        if: runner.os == 'macOS'
        run: brew list htslib > /dev/null 2>&1 || brew install htslib
      - name: Oracle check of the packaged binary
        run: |
          mkdir unpacked
          tar -xzf "fast-beagle-$VERSION/dist/$PACKAGE.tar.gz" -C unpacked
          cd "fast-beagle-$VERSION"
          tests/check-oracle.sh "$GITHUB_WORKSPACE/unpacked/$PACKAGE/fast-beagle" | tee "$RUNNER_TEMP/oracle.log"
          echo "binary $PACKAGE: $(grep -c '^PASS' "$RUNNER_TEMP/oracle.log") oracle runs passed" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-binary-${{ matrix.name }}
          path: fast-beagle-${{ env.VERSION }}/dist/${{ env.PACKAGE }}.tar.gz
          if-no-files-found: error

  # The macOS installer: the binary of the macos-arm64 package in a .pkg that
  # installs it as /usr/local/bin/fast-beagle (release/build-pkg.sh). The binary
  # and the installer are signed with the Developer ID certificates and the
  # installer is notarised. The job then installs the .pkg and runs the
  # installed binary. A pull request from a fork has no secrets and skips it.
  macos-pkg:
    needs: [source, binaries]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.source.outputs.version }}
      PACKAGE: fast-beagle-${{ needs.source.outputs.version }}-macos-arm64
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-source
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-binary-macos-arm64
          path: dist
      # A keychain of this job only, first in the search list, that codesign
      # and pkgbuild may use without a prompt.
      - name: Import the Developer ID certificates
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<< "$MACOS_CERT_P12" > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/pkgbuild
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Build, sign and notarise the installer
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          tar -xzf "dist/fast-beagle-$VERSION.tar.gz"
          mkdir unpacked
          tar -xzf "dist/$PACKAGE.tar.gz" -C unpacked
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          NOTARY_KEY="$RUNNER_TEMP/notary.p8" "fast-beagle-$VERSION/release/build-pkg.sh" "$VERSION" "unpacked/$PACKAGE" pkg
          rm "$RUNNER_TEMP/notary.p8"
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
      # The recipe's test, on the binary the installer put in place.
      - name: Install the package and run the binary
        run: |
          sudo installer -pkg "pkg/$PACKAGE.pkg" -target /
          codesign --verify --strict --verbose=2 /usr/local/bin/fast-beagle
          brew list htslib > /dev/null 2>&1 || brew install htslib
          cd "fast-beagle-$VERSION/release/conda"
          /usr/local/bin/fast-beagle gt=small.vcf out="$RUNNER_TEMP/small" nthreads=2
          test "$(bgzip -dc "$RUNNER_TEMP/small.vcf.gz" | grep -vc '^#')" = 40
          echo "$PACKAGE.pkg: signed, notarised, installed and run" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-pkg-macos-arm64
          path: pkg/${{ env.PACKAGE }}.pkg
          if-no-files-found: error

  # Publishes the release from a pushed tag once every build and check passed.
  publish:
    needs: [source, conda, binaries, macos-pkg]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: |
          cd dist
          sha256sum fast-beagle-*.tar.gz fast-beagle-*.pkg > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/fast-beagle-*.tar.gz
            dist/fast-beagle-*.pkg
            dist/SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.source.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "fast-beagle $VERSION" \
            --notes "fast-beagle $VERSION, the Beagle 5.5 edition. The source tarball, binaries for Linux x86_64, Linux arm64 (glibc 2.28 or later) and macOS arm64 with htslib linked statically, and a signed and notarised macOS installer of the macOS binary. [The release run]($RUN_URL) checked every binary, and the conda package built from the tarball on each platform, against every oracle hash. Every file carries a build provenance attestation, which \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\` checks." \
            fast-beagle-*.tar.gz fast-beagle-*.pkg SHA256SUMS
